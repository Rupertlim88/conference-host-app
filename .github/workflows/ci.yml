name: ci
# Runs every check of the host app on pull requests, and by hand: the tests of every package against a real Postgres,
# types, lint, the package boundaries, the script tests (which include the check of every rule's tie to its file), the
# dependency list, the Python side of the conference API's contract, and the model check of sends.
on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  TURBO_TELEMETRY_DISABLED: "1"
  DO_NOT_TRACK: "1"

jobs:
  checks:
    name: checks
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      HOST_TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/host_test
      HOST_BACKEND_TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/host_backend_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: The test databases
        run: |
          for db in host_test host_backend_test; do
            PGPASSWORD=postgres psql -h localhost -U postgres -c "create database $db"
          done
      - name: Boundaries (package graph)
        run: npm run boundaries
      - name: Lint
        run: npm run lint
      - name: Types
        run: npm run check-types
      - name: Tests
        run: npx turbo run test --concurrency=1
      - name: Script tests, with the check of every tie
        run: npm run test:scripts
      - name: Every tie holds
        run: npm run ties
      - name: DEPENDENCIES.md is current
        run: npm run deps:check
      - uses: astral-sh/setup-uv@v6
      - name: The Python side of the conference API's contract
        run: uv run --locked pytest -q
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - name: Two sends never write at once (TLA+ model check)
        run: node backend/verification/run.mjs --install && node backend/verification/run.mjs
