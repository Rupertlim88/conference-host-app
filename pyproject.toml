# The repo's Python: the Python side of the conference API's contract (conference-api-contract/pytests).
# Run the tests with: uv run pytest
[project]
name = "conference-host-app-python"
version = "0.0.0"
requires-python = ">=3.12"
dependencies = []

[dependency-groups]
test = ["jsonschema>=4.23", "pytest>=8"]

[tool.uv]
package = false
default-groups = ["test"]

[tool.pytest.ini_options]
testpaths = ["conference-api-contract/pytests"]
